name: Release Chemical Review plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Codex CLI for plugin smoke
        run: npm install --global @openai/codex@0.149.0
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check ruff==0.14.14
      - name: Require a tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Verify tag matches plugin version
        run: |
          test "v$(python -c 'import json; print(json.load(open("plugins/chemical-review/.codex-plugin/plugin.json"))["version"])')" = "$GITHUB_REF_NAME"
      - name: Verify and test release candidate
        run: |
          python scripts/build_plugin.py --check
          python scripts/validate_plugin_package.py
          python -m unittest discover -s tests -p 'test_*.py'
          ruff check --target-version py311 .agents/skills/chemical-review plugins/chemical-review/skills/chemical-review scripts tests
      - name: Build plugin archive
        run: python scripts/package_plugin.py
      - name: Run bundled cold-start smoke
        run: python -B scripts/smoke_plugin.py
      - name: Install and cold-start the plugin copy
        run: python -B scripts/smoke_plugin_install.py
      - name: Verify release checksum
        run: (cd dist && sha256sum -c chemical-review-*.zip.sha256)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/chemical-review-*.zip
          dist/chemical-review-*.zip.sha256
          --verify-tag
          --generate-notes
