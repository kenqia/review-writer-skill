name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Codex CLI for plugin smoke
        run: npm install --global @openai/codex@0.149.0
      - name: Install verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.14.14
          python-docx==1.2.0
          Pillow==12.2.0
      - name: Verify canonical plugin projection
        run: python scripts/build_plugin.py --check
      - name: Validate plugin package
        run: python scripts/validate_plugin_package.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run Ruff
        run: ruff check --target-version py311 .agents/skills/chemical-review plugins/chemical-review/skills/chemical-review scripts tests
      - name: Build release archive
        run: python scripts/package_plugin.py
      - name: Run bundled cold-start smoke
        run: python -B scripts/smoke_plugin.py
      - name: Install and cold-start the plugin copy
        run: python -B scripts/smoke_plugin_install.py
      - name: Verify release checksum
        run: (cd dist && sha256sum -c chemical-review-*.zip.sha256)
