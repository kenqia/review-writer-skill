name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check ruff==0.14.14
      - name: Verify canonical plugin projection
        run: python scripts/build_plugin.py --check
      - name: Validate plugin package
        run: python scripts/validate_plugin_package.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run Ruff
        run: ruff check .agents/skills/chemical-review plugins/chemical-review/skills/chemical-review scripts tests
      - name: Build release archive
        run: python scripts/package_plugin.py
